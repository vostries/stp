name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/Debug/dataconv_tests.exe
          else
            ./build/dataconv_tests
          fi
        shell: bash
